# Standalone (not a workspace member): a pyo3 extension-module needs a Python
# interpreter at build time, so it is built by maturin rather than `cargo --workspace`.
# Concrete fields (no `.workspace` inheritance) since it sits outside the workspace;
# the version here and in pyproject.toml are rewritten from the workspace version by
# the pre-release-replacements in crates/sharpebench-cli/release.toml.
[package]
name = "sharpebench-py"
version = "0.5.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Python bindings (pyo3) for SharpeBench's honest-backtest statistics."
repository = "https://github.com/general-liquidity/sharpebench"

[lib]
name = "sharpebench_py"
crate-type = ["cdylib"]

[dependencies]
serde = "1"
# serde_json's default parser can land 1 ULP off the correctly-rounded float;
# this feature makes parsing exact, so a submission ranked from JSON is
# bit-identical to the same submission ranked from in-memory arrays
# (`rank_returns` vs `rank_board`), matching sharpebench-harness's choice.
serde_json = { version = "1", features = ["float_roundtrip"] }
sharpebench-stats = { path = "../sharpebench-stats", version = "0.5.0" }
sharpebench-edge = { path = "../sharpebench-edge", version = "0.5.0" }
sharpebench-core = { path = "../sharpebench-core", version = "0.5.0" }

[dependencies.pyo3]
version = "0.29"
features = ["extension-module"]
