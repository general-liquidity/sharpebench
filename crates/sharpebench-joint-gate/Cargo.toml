[package]
name = "sharpebench-joint-gate"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Producer for the joint-gate validation study: runs the shipped scorer end to end on declared fields, resumably, under a sealed protocol."
repository.workspace = true
# A research producer, on no registry; see the same note in sharpebench-study.
publish = false

[[bin]]
name = "joint-gate-study"
path = "src/bin/joint_gate_study.rs"

[dependencies]
sharpebench-core = { path = "../sharpebench-core", version = "0.29.1" }
sharpebench-harness = { path = "../sharpebench-harness", version = "0.29.1" }
sharpebench-protocol = { path = "../sharpebench-protocol", version = "0.29.1" }
sharpebench-sim = { path = "../sharpebench-sim", version = "0.29.1" }
sharpebench-stats = { path = "../sharpebench-stats", version = "0.29.1" }
sharpebench-study = { path = "../sharpebench-study", version = "0.29.1" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

sha2 = "0.11"

[lints]
workspace = true
