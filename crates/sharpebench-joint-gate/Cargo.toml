[package]
name = "sharpebench-joint-gate"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Producer for the joint-gate validation study: runs the shipped scorer end to end on declared fields, resumably, under a sealed protocol."
repository.workspace = true
# A research producer, on no registry; see the same note in sharpebench-study.
publish = false

[[bin]]
name = "joint-gate-study"
path = "src/bin/joint_gate_study.rs"

[dependencies]
sharpebench-core = { path = "../sharpebench-core" }
sharpebench-harness = { path = "../sharpebench-harness" }
sharpebench-protocol = { path = "../sharpebench-protocol" }
sharpebench-sim = { path = "../sharpebench-sim" }
sharpebench-study = { path = "../sharpebench-study" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

sha2 = "0.11"

[lints]
workspace = true
