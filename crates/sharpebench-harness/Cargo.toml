[package]
name = "sharpebench-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SharpeBench orchestration: drive an agent over seeds × windows and capture trajectories (Phase 1)."
repository.workspace = true

[dependencies]
sharpebench-core = { path = "../sharpebench-core", version = "0.12.0" }
sharpebench-protocol = { path = "../sharpebench-protocol", version = "0.12.0" }
sharpebench-sim = { path = "../sharpebench-sim", version = "0.12.0" }
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: the checkpoint persists each Run's f64 return series, and a
# resumed sweep must reload it bit-identically to an uninterrupted one (determinism
# + attestation). serde_json's default parser can land 1 ULP off; this feature makes
# parse the exact inverse of serialize.
serde_json = { version = "1", features = ["float_roundtrip"] }

# Examples are not test targets by default, so a `#[test]` inside one is compiled
# and never run. This example is the bridge to the sibling SharpeArena repository
# and its preflight is the part that has to hold; opting the target into the test
# harness is the only way to assert on it without moving the logic out of the
# example it belongs to.
[[example]]
name = "local_open_weight_field_eval"
test = true

[lints]
workspace = true
