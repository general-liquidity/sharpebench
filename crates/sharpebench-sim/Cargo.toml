[package]
name = "sharpebench-sim"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SharpeBench point-in-time market simulator + reference agents (Phase 1)."
repository.workspace = true
keywords = ["benchmark", "trading", "backtest", "simulation", "quant"]
categories = ["science", "finance", "simulation"]

[dependencies]
sharpebench-core = { path = "../sharpebench-core", version = "0.27.0" }
sharpebench-protocol = { path = "../sharpebench-protocol", version = "0.27.0" }
# The sizing-response diagnostic reuses the tie-correct Spearman rho. The crate
# is already linked through sharpebench-core, so the build gains no new crate.
sharpebench-stats = { path = "../sharpebench-stats", version = "0.27.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
