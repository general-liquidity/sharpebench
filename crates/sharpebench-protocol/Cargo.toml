[package]
name = "sharpebench-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SharpeBench language-agnostic agent ⇄ harness protocol (JSON message types)."
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
# Needed in the library, not only in tests: `decision_from_wire` owns the
# entrant-facing diagnostic for the closed wire contract, so the deserialization
# error has to be inspected here rather than discarded by each transport.
serde_json = "1"

[lints]
workspace = true
