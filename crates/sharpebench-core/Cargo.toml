[package]
name = "sharpebench-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Deterministic, luck-robust quantitative evaluation kernel for trading agents."
repository.workspace = true
keywords = ["benchmark", "trading", "sharpe", "quant", "evaluation"]
categories = ["science", "finance"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# Numeric replay cannot depend on which other workspace crate enables this
# feature. The isolated scorer must read exactly the same f64s as the harness.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
sharpebench-protocol = { path = "../sharpebench-protocol", version = "0.23.0" }
sharpebench-stats = { path = "../sharpebench-stats", version = "0.23.0" }

[dev-dependencies]

[lints]
workspace = true
