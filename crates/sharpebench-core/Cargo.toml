[package]
name = "sharpebench-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Deterministic, luck-robust scoring kernel for SharpeBench (deflated Sharpe / PSR / pass^k / process / decay)."
repository.workspace = true
keywords = ["benchmark", "trading", "sharpe", "quant", "evaluation"]
categories = ["science", "finance"]

[dependencies]
serde = { version = "1", features = ["derive"] }
sharpebench-stats = { path = "../sharpebench-stats", version = "0.2.0" }

[dev-dependencies]
serde_json = "1"
# Dev-only cycle (sim depends on core): the golden-score tests build a fixture field
# from the public simulator API so the scorer is pinned on realistic trajectories.
sharpebench-sim = { path = "../sharpebench-sim", version = "0.2.0" }

[lints]
workspace = true
