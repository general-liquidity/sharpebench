[package]
name = "sharpebench-memory"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Three-arm memory ablation harness (baseline / retrieval / oracle): does a retrieval layer measurably improve downstream agent decisions? Significance reuses sharpebench-stats."
repository.workspace = true
keywords = ["ablation", "retrieval", "memory", "benchmark", "significance"]
categories = ["science", "mathematics"]

[dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
sharpebench-stats = { path = "../sharpebench-stats", version = "0.28.0" }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
