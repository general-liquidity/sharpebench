[package]
name = "sharpebench-stats"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Deterministic backtest-honesty statistics: PSR, deflated Sharpe, the data-snooping family (White RC / Hansen SPA / Romano-Wolf), and selection robustness. Extracted from sharpebench-core."
repository.workspace = true
keywords = ["sharpe", "statistics", "backtest", "bootstrap", "finance"]
categories = ["science", "mathematics"]

[dependencies]
# Special functions only (erf, erfc, erfc_inv). Default features off keeps
# nalgebra, rand and the KDE surface out of the graph; `std` is the whole of
# what the three wrappers in `stats.rs` need, and it builds for
# wasm32-unknown-unknown. The moment estimators stay hand-rolled: see the
# module doc in `src/stats.rs`.
statrs = { version = "0.19.1", default-features = false, features = ["std"] }

[lints]
workspace = true
