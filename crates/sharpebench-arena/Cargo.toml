[package]
name = "sharpebench-arena"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SharpeBench forward-league driver: file-backed arena windows over the attest + leaderboard primitives."
repository.workspace = true

[dependencies]
sharpebench-core = { path = "../sharpebench-core", version = "0.21.0" }
sharpebench-attest = { path = "../sharpebench-attest", version = "0.21.0" }
sharpebench-leaderboard = { path = "../sharpebench-leaderboard", version = "0.21.0" }
# For the sandboxed external-agent transport only (`sandbox.rs` wraps
# `sharpebench_sim::ExternalAgent`). sim depends on core + protocol and never on
# arena, so arena -> sim introduces no cycle.
sharpebench-sim = { path = "../sharpebench-sim", version = "0.21.0" }
# Observation/decision types named by the `Agent` impl on `SandboxedAgent`.
sharpebench-protocol = { path = "../sharpebench-protocol", version = "0.21.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# `tests/cli_arena_cmd.rs` compiles the CLI's `arena_cmd.rs`, which validates a
# window's `--fault-plan` with the harness. harness never depends on arena, so
# this adds no cycle, and harness publishes before arena.
sharpebench-harness = { path = "../sharpebench-harness", version = "0.21.0" }

[lints]
workspace = true
