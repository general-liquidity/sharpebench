[package]
name = "sharpebench-arena"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SharpeBench forward-league driver: file-backed arena windows over the attest + leaderboard primitives."
repository.workspace = true

[dependencies]
sharpebench-core = { path = "../sharpebench-core", version = "0.29.1" }
# The forward evidence ledger's betting e-process and e-BH (`forward_evidence.rs`).
sharpebench-stats = { path = "../sharpebench-stats", version = "0.29.1" }
sharpebench-attest = { path = "../sharpebench-attest", version = "0.29.1" }
sharpebench-leaderboard = { path = "../sharpebench-leaderboard", version = "0.29.1" }
# For the sandboxed external-agent transport only (`sandbox.rs` wraps
# `sharpebench_sim::ExternalAgent`). sim depends on core + protocol and never on
# arena, so arena -> sim introduces no cycle.
sharpebench-sim = { path = "../sharpebench-sim", version = "0.29.1" }
# Observation/decision types named by the `Agent` impl on `SandboxedAgent`.
sharpebench-protocol = { path = "../sharpebench-protocol", version = "0.29.1" }
# Reveal intake replays each entry's capture with the harness's strict verifier
# and re-executes it with the harness's re-execution check (`intake.rs`). The
# CLI's `arena_cmd.rs`, compiled by `tests/cli_arena_cmd.rs`, also validates a
# window's `--fault-plan` with it. harness never depends on arena, so this adds
# no cycle, and harness publishes before arena.
sharpebench-harness = { path = "../sharpebench-harness", version = "0.29.1" }
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: the forward ledger is recomputed bit for bit from the
# f64 values a signed header records, so every number must read back exactly.
serde_json = { version = "1", features = ["float_roundtrip"] }

[lints]
workspace = true
