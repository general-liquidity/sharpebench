[workspace]
resolver = "2"
members = [
    "crates/sharpebench-stats",
    "crates/sharpebench-edge",
    "crates/sharpebench-core",
    "crates/sharpebench-cli",
    "crates/sharpebench-protocol",
    "crates/sharpebench-wasm",
    "crates/sharpebench-sim",
    "crates/sharpebench-harness",
    "crates/sharpebench-attest",
    "crates/sharpebench-leaderboard",
    "crates/sharpebench-arena",
    "crates/sharpebench-memory",
    "crates/sharpebench-study",
    "crates/sharpebench-joint-gate",
    "xtask",
    "examples/reference-agent",
]
# pyo3 extension-module crate: it needs a Python interpreter at build time and is
# built by maturin, not `cargo --workspace`. Excluded so the Rust-only CI stays green.
exclude = ["crates/sharpebench-py"]

[workspace.package]
version = "0.29.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/general-liquidity/sharpebench"
authors = ["General Liquidity, Inc."]

# Lints enforced by the manifest (not just the CI `-D warnings` flag), so a plain
# `cargo clippy` locally fails the same way CI does. Crates opt in via `[lints]
# workspace = true`. We do not ban unwrap/expect — internal code is trusted and
# only validates at boundaries — but we deny stray todo!()/dbg!() and all of
# clippy's default lints.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
todo = "deny"
dbg_macro = "deny"

# `sharpebench-stats` is built optimised in dev and test builds too. Its
# `det_math` routines (exp, ln, powf and the integer-power loop the moment
# estimators call about a million times per scored agent) are double-double
# and loop code that runs tens of times slower unoptimised, which pushed the
# debug test suite and the mutation shards past their CI time limits. The
# override cannot change a result: det_math uses only IEEE operations that
# every optimisation level evaluates identically, and the release and debug
# runs of `det_math_bits`, `special_function_bits` and `rerouted_math_bits`
# pin the same bits. Overflow checks and debug assertions stay on: they are
# separate profile settings and this changes only the optimisation level.
[profile.dev.package.sharpebench-stats]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
