name: Publish paper page

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/paper-pages.yml
      - docs/paper-page.html
      - paper/main.pdf

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository_owner == 'general-liquidity' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages
      - name: Assemble the paper page and existing PDF
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          mkdir -p _site/paper
          cp paper/main.pdf _site/paper/main.pdf
          python3 - <<'PY'
          import os
          from html import escape
          from pathlib import Path

          base_url = os.environ["SITE_URL"].rstrip("/")
          if not base_url.startswith("https://"):
              raise ValueError("GitHub Pages must provide an HTTPS site URL")
          template = Path("docs/paper-page.html").read_text(encoding="utf-8")
          page_url = escape(f"{base_url}/paper/", quote=True)
          Path("_site/paper/index.html").write_text(
              template.replace("__PAPER_URL__", page_url),
              encoding="utf-8",
          )
          PY
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
