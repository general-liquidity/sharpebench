name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# A superseded push has nothing left to prove; cancel its runs so the newest
# commit gets the runners. Release tags run their own workflow, unaffected.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-rehearsal:
    name: isolated release rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-release@1.1.2
      - name: Test release-driver guards and cleanup ordering
        run: python -m unittest scripts/test_release.py
      - name: Rehearse the complete cut, rebind, and cleanup sequence
        # HEAD is the candidate tree on both pushes and PRs. The real execute
        # command defaults to freshly fetched origin/main; rehearsing origin/main
        # here would test the old driver on a PR and reject the PR's own changelog.
        run: python scripts/release.py rehearse patch --base-ref HEAD --no-fetch

  check:
    name: fmt · clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      # Pin the action to the same channel rust-toolchain.toml selects. With @stable the
      # runner downloads stable and installs the components onto it, then rustup redirects
      # cargo to 1.96.0 anyway, so the components land on a toolchain nothing runs.
      - name: Install Rust (matching rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Rustdoc (deny warnings)
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --workspace --no-deps

  test:
    name: build · test (${{ matrix.os }})
    # The golden-score tests pin two committed fields on Linux, macOS, and Windows.
    # The wasm/native tests exercise the host-testable facade on the same matrix;
    # actual wasm-pack/npm parity runs on Ubuntu in npm.yml. These are fixture- and
    # host-scoped checks, not a claim about every input or platform.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (matching rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --locked || cargo build --workspace

      - name: Test
        run: cargo test --workspace

  python:
    name: sharpebench-py (fmt, clippy, maturin, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # crates/sharpebench-py is `exclude`d from the workspace (pyo3 needs a Python
    # interpreter at build time), so the `check` job above never sees it: root
    # `cargo fmt --all` / `cargo clippy --all-targets` resolve against workspace
    # members only. Without this job a broken binding is first discovered by the
    # release workflow at publish time. Every command here runs from inside the
    # crate directory, which is the only way to reach an excluded crate.
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust 1.96.0 (matches rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/sharpebench-py

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Format
        working-directory: crates/sharpebench-py
        run: cargo fmt -- --check

      - name: Clippy (deny warnings)
        working-directory: crates/sharpebench-py
        run: cargo clippy --all-targets -- -D warnings

      - name: maturin develop + pytest (in a venv)
        working-directory: crates/sharpebench-py
        # maturin refuses to install without an active virtualenv ("Couldn't find a
        # virtualenv or conda environment"), hence the venv rather than a bare pip.
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip maturin pytest numpy
          maturin develop
          python -m pytest tests -q

  determinism:
    name: scores are reproducible (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
      - name: Same input → byte-identical leaderboard, twice
        shell: bash
        run: |
          cargo run -q -p sharpebench -- score suites/example_submissions.json > a.txt
          cargo run -q -p sharpebench -- score suites/example_submissions.json > b.txt
          diff a.txt b.txt && echo "deterministic ✓"
      # Same-machine agreement only proves the run is repeatable; a math change would
      # move both outputs together. The committed golden is the fixed point: the CLI's
      # `--json` output must match it byte-for-byte on every OS in the matrix. Regenerate
      # deliberately with `SHARPEBENCH_UPDATE_GOLDEN=1 cargo test -p sharpebench-core
      # --test golden_scores` (refused when CI=true).
      - name: CLI output → byte-identical to the committed golden fixture
        shell: bash
        run: |
          cargo run -q -p sharpebench -- score suites/example_submissions.json --json > scored.json
          diff scored.json crates/sharpebench-core/golden/example_submissions.scores.json && echo "matches golden ✓"

  sandbox:
    # The container boundary is the only security claim in this repository that
    # cannot be proved by a pure function: everything else about the sandbox is
    # decided by `resolve_launch`, which is testable without Docker. The hostile
    # probe and the live spawn are `#[ignore]`d so that a machine without a
    # daemon reports them as ignored rather than counting them as passes, which
    # means they run nowhere unless a job asks for them. This is that job.
    name: live container boundary (hostile probe)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2

      - name: Docker daemon is present and answering
        run: docker version

      # The probe needs a POSIX fixture with /bin/sh, id, awk, ls, touch and
      # chmod, present locally (the hardened launch passes `--pull never`), and
      # referenced by digest (the launch refuses a mutable tag by default).
      # Resolving the digest from the pulled image is what makes the pin exact
      # rather than aspirational.
      - name: Pull and digest-pin the fixture image
        run: |
          docker pull alpine:3.22
          digest=$(docker image inspect alpine:3.22 --format '{{index .RepoDigests 0}}')
          echo "resolved fixture: $digest"
          case "$digest" in
            *@sha256:*) ;;
            *) echo "refusing to run against an unpinned fixture: $digest"; exit 1 ;;
          esac
          echo "SHARPEBENCH_SANDBOX_FIXTURE=$digest" >> "$GITHUB_ENV"

      # `--ignored` runs exactly the tests the other jobs skip. `--include-ignored`
      # is deliberately not used: the non-ignored arena tests already run in the
      # `test` job on three OSes, and this job should fail for one reason only.
      - name: Run the ignored live-boundary tests
        run: cargo test -p sharpebench-arena -- --ignored --nocapture

  audit:
    name: benchmark self-audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
      - name: The scorer resists every known gaming attack
        run: cargo run -q -p sharpebench -- audit

  realism:
    name: frozen datasets behave like markets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
      - name: The scoring data exhibits Cont's stylized facts
        run: |
          cargo run -q -p sharpebench -- realism --data data/us-indices-1d.csv
          cargo run -q -p sharpebench -- realism --data data/crypto-majors-1d.csv

  supply-chain:
    name: cargo-deny (licenses · advisories · bans · sources)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      # sharpebench-py is excluded from the Rust-only workspace, so the action
      # above cannot see its pyo3 dependency tree. Run the pinned binary from
      # that crate against the same root policy.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.9
      - name: cargo-deny (crates/sharpebench-py, excluded from the workspace)
        working-directory: crates/sharpebench-py
        run: cargo deny check --config ../../deny.toml

  docs:
    name: docs build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the book
        run: mdbook build docs/book

  paper-provenance:
    name: paper evidence provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: the manifest records the commit it was generated at, and the
      # checker requires that commit to be an ancestor of HEAD. A shallow clone does
      # not contain it, and the checker fails rather than skipping the ancestry leg.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Provenance policy cannot be narrowed by its manifest
        run: python -m unittest paper/src/test_provenance.py
      - name: Every recorded source and artifact matches the committed scope
        run: python paper/src/check-provenance.py
