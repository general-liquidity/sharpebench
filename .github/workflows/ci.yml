name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# A superseded push has nothing left to prove; cancel its runs so the newest
# commit gets the runners. Release tags run their own workflow, unaffected.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formal:
    name: Lean model (kernel, leanchecker, axiom audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Verify selected forecast invariants
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          lake-package-directory: formal
          use-mathlib-cache: false
          build: true
          test: false
          lint: false
          leanchecker: true
          leanchecker-args: SharpeBenchFormal
          # nanoda cannot parse Lean 4.28+ exports yet:
          # https://github.com/leanprover/lean-action/issues/169
          nanoda: false
          axiom-audit: true
          axiom-audit-root: SharpeBenchFormal

  release-rehearsal:
    name: isolated release rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect an already released HEAD
        id: release-head
        shell: bash
        run: |
          if [ -n "$(git tag --points-at HEAD --list 'v*')" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@master
        if: steps.release-head.outputs.released != 'true'
        with:
          toolchain: "1.96.0"
      - uses: taiki-e/install-action@v2
        if: steps.release-head.outputs.released != 'true'
        with:
          tool: cargo-release@1.1.2
      - name: Test release-driver guards and cleanup ordering
        run: python -m unittest scripts/test_release.py
      - name: Rehearse the complete cut, rebind, and cleanup sequence
        if: steps.release-head.outputs.released != 'true'
        # HEAD is the candidate tree on both pushes and PRs. The real execute
        # command defaults to freshly fetched origin/main; rehearsing origin/main
        # here would test the old driver on a PR and reject the PR's own changelog.
        run: python scripts/release.py rehearse patch --base-ref HEAD --no-fetch

  check:
    name: fmt · clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      # Pin the action to the same channel rust-toolchain.toml selects. With @stable the
      # runner downloads stable and installs the components onto it, then rustup redirects
      # cargo to 1.96.0 anyway, so the components land on a toolchain nothing runs.
      - name: Install Rust (matching rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Rustdoc (deny warnings)
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --workspace --no-deps

  test:
    name: build · test (${{ matrix.os }})
    # The golden-score tests pin two committed fields on Linux, macOS, and Windows.
    # The wasm/native tests exercise the host-testable facade on the same matrix;
    # actual wasm-pack/npm parity runs on Ubuntu in npm.yml. These are fixture- and
    # host-scoped checks, not a claim about every input or platform.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (matching rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"

      - uses: Swatinem/rust-cache@v2

      # Pinned release binary rather than `cargo install`: the runner downloads
      # one archive instead of compiling the runner on every OS.
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.143

      - name: Build
        run: cargo build --workspace --locked || cargo build --workspace

      # nextest runs every test binary's tests in one process-per-test pool, so
      # the crate-by-crate serialisation of `cargo test` no longer floors the
      # leg on its slowest binary. `#[ignore]`d tests stay skipped here; the one
      # long harness reconstruction runs in `slow-harness` below.
      - name: Test
        run: cargo nextest run --workspace

      # nextest does not run doctests; keep them on every OS as before.
      - name: Doctests
        run: cargo test --workspace --doc

  slow-harness:
    name: slow harness (clone-merge regression)
    # `mandate_field_changes_dispersion_source_on_three_panels` reconstructs two
    # nine-dataset fields with the current engine and takes about 6.5 minutes on
    # its own, which used to floor all three OS legs of `test`. It is `#[ignore]`d
    # there and runs here, on one OS, in parallel with the matrix. `--ignored`
    # runs only that test so this job fails for one reason only.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
      - name: Run the ignored clone-merge regression
        run: cargo test -p sharpebench-harness --test evidence_fields_no_clone_merges -- --ignored

  python:
    name: sharpebench-py (fmt, clippy, maturin, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # crates/sharpebench-py is `exclude`d from the workspace (pyo3 needs a Python
    # interpreter at build time), so the `check` job above never sees it: root
    # `cargo fmt --all` / `cargo clippy --all-targets` resolve against workspace
    # members only. Without this job a broken binding is first discovered by the
    # release workflow at publish time. Every command here runs from inside the
    # crate directory, which is the only way to reach an excluded crate.
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust 1.96.0 (matches rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/sharpebench-py

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Format
        working-directory: crates/sharpebench-py
        run: cargo fmt -- --check

      - name: Clippy (deny warnings)
        working-directory: crates/sharpebench-py
        run: cargo clippy --all-targets -- -D warnings

      - name: maturin develop + pytest (in a venv)
        working-directory: crates/sharpebench-py
        # maturin refuses to install without an active virtualenv ("Couldn't find a
        # virtualenv or conda environment"), hence the venv rather than a bare pip.
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip maturin pytest numpy
          maturin develop
          python -m pytest tests -q

  determinism:
    name: scores are reproducible (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
      - name: Same input → byte-identical leaderboard, twice
        shell: bash
        run: |
          cargo run -q -p sharpebench -- score suites/example_submissions.json > a.txt
          cargo run -q -p sharpebench -- score suites/example_submissions.json > b.txt
          diff a.txt b.txt && echo "deterministic ✓"
      # Same-machine agreement only proves the run is repeatable; a math change would
      # move both outputs together. The committed golden is the fixed point: the CLI's
      # `--json` output must match it byte-for-byte on every OS in the matrix. Regenerate
      # deliberately with `SHARPEBENCH_UPDATE_GOLDEN=1 cargo test -p sharpebench-core
      # --test golden_scores` (refused when CI=true).
      - name: CLI output → byte-identical to the committed golden fixture
        shell: bash
        run: |
          cargo run -q -p sharpebench -- score suites/example_submissions.json --json > scored.json
          diff scored.json crates/sharpebench-core/golden/example_submissions.scores.json && echo "matches golden ✓"

  sandbox:
    # The container boundary is the only security claim in this repository that
    # cannot be proved by a pure function: everything else about the sandbox is
    # decided by `resolve_launch`, which is testable without Docker. The hostile
    # probe and the live spawn are `#[ignore]`d so that a machine without a
    # daemon reports them as ignored rather than counting them as passes, which
    # means they run nowhere unless a job asks for them. This is that job.
    name: live container boundary (hostile probe)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2

      - name: Docker daemon is present and answering
        run: docker version

      # The probe needs a POSIX fixture with /bin/sh, id, awk, ls, touch and
      # chmod, present locally (the hardened launch passes `--pull never`), and
      # referenced by digest (the launch refuses a mutable tag by default).
      # Resolving the digest from the pulled image is what makes the pin exact
      # rather than aspirational.
      - name: Pull and digest-pin the fixture image
        run: |
          docker pull alpine:3.22
          digest=$(docker image inspect alpine:3.22 --format '{{index .RepoDigests 0}}')
          echo "resolved fixture: $digest"
          case "$digest" in
            *@sha256:*) ;;
            *) echo "refusing to run against an unpinned fixture: $digest"; exit 1 ;;
          esac
          echo "SHARPEBENCH_SANDBOX_FIXTURE=$digest" >> "$GITHUB_ENV"

      # `--ignored` runs exactly the tests the other jobs skip. `--include-ignored`
      # is deliberately not used: the non-ignored arena tests already run in the
      # `test` job on three OSes, and this job should fail for one reason only.
      - name: Run the ignored live-boundary tests
        run: >
          cargo test -p sharpebench-arena -- --ignored --nocapture
          --skip sandbox::tests::live_gateway_launch_serves_model_calls_over_stdio_with_no_network

      # The gateway launch against the daemon: the argv `gateway_launch` returns
      # starts the pinned fixture, model calls ride its stdio to a provider that
      # cannot open a socket, the journal on disk records every call, only
      # loopback exists inside, and the container is classified and removed.
      # Named exactly, and skipped above, so it runs once.
      - name: Run the live gateway launch against the pinned fixture
        run: >
          cargo test -p sharpebench-arena --lib --
          --ignored --exact --nocapture
          sandbox::tests::live_gateway_launch_serves_model_calls_over_stdio_with_no_network

      # The image preflight's one leg that a daemon-free machine cannot prove:
      # a clean pinned fixture authorizes, a known header needle refuses, both
      # with verified cleanup and the same configuration ID. Named exactly, not
      # `--ignored`: the CLI crate has other ignored tests whose fixtures need
      # an environment this job does not set up, and this job should fail for
      # one reason only.
      - name: Run the live image preflight against the pinned fixture
        run: >
          cargo test -p sharpebench --bin sharpebench --
          --ignored --exact --nocapture
          artifact_preflight::tests::live_docker_image_preflight

      # The runtime allowlist and the functional probe against the daemon: the
      # entries Docker adds to an export are measured and printed, an allowlist
      # naming exactly the fixture's paths admits it and the probe runs, and an
      # allowlist missing one path refuses it by index without starting it.
      - name: Run the live runtime allowlist and probe against the pinned fixture
        run: >
          cargo test -p sharpebench --bin sharpebench --
          --ignored --exact --nocapture
          artifact_preflight::tests::live_runtime_allowlist_admits_the_fixture_and_its_probe_passes
          artifact_preflight::tests::live_runtime_allowlist_refuses_an_omitted_path_by_index

      # `--image` for the trajectory commands against the daemon: capture and
      # `verify-trajectory --reexecute` launch the pinned fixture through the
      # hardened boundary, the fixture's `/bin/sh` entrypoint answers no
      # decision and is reported as a typed transport failure, nothing is
      # written, and no `sharpebench-agent-*` container is left behind. Named
      # exactly, for the same reason as the preflight legs above.
      - name: Run the live trajectory capture and re-execution against the pinned fixture
        run: >
          cargo test -p sharpebench --test fault_backoff_reexecution_cli --
          --ignored --exact --nocapture
          live_image_capture_and_reexecution_launch_the_hardened_sandbox

  audit:
    name: benchmark self-audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
      - name: The scorer resists every known gaming attack
        run: cargo run -q -p sharpebench -- audit

  realism:
    name: frozen datasets behave like markets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
      - name: The scoring data exhibits Cont's stylized facts
        run: |
          cargo run -q -p sharpebench -- realism --data data/us-indices-1d.csv
          cargo run -q -p sharpebench -- realism --data data/crypto-majors-1d.csv

  supply-chain:
    name: cargo-deny (licenses · advisories · bans · sources)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      # sharpebench-py is excluded from the Rust-only workspace, so the action
      # above cannot see its pyo3 dependency tree. Run the pinned binary from
      # that crate against the same root policy.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.9
      - name: cargo-deny (crates/sharpebench-py, excluded from the workspace)
        working-directory: crates/sharpebench-py
        run: cargo deny check --config ../../deny.toml

  docs:
    name: docs build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the book
        run: mdbook build docs/book

  paper-provenance:
    name: paper evidence provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: the manifest records the commit it was generated at, and the
      # checker requires that commit to be an ancestor of HEAD. A shallow clone does
      # not contain it, and the checker fails rather than skipping the ancestry leg.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Provenance policy cannot be narrowed by its manifest
        run: python -m unittest paper/src/test_provenance.py
      - name: Sweep coverage requires the declared grid, not row count
        run: python -m unittest paper/src/test_sweep_grid.py
      - name: A prospective field plan must declare the contracts it verifies
        run: python -m unittest paper/src/test_import_prospective_field.py
      - name: The forecast report recomputes independently in Python
        run: python -m unittest paper/src/test_check_prospective_forecast_report.py
      - name: Every recorded source and artifact matches the committed scope
        run: python paper/src/check-provenance.py

  llm-shim:
    name: LLM field shim (call ceiling, model identity)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Its own job rather than a step in `paper-provenance`, which installs nothing:
    # these regressions need the Anthropic SDK on the path because the load-bearing
    # case drives a real SDK client over a stand-in HTTP transport to observe the
    # SDK's own retry policy. No credential and no provider are involved; the
    # transport answers every request locally.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the SDK the ceiling claim was evidenced against
        # Pinned, not floating. The load-bearing regression asserts this SDK's
        # own retry policy (0.112.0: DEFAULT_MAX_RETRIES 2, and `_base_client`
        # looping `range(max_retries + 1)` over 408, 409, 429, 5xx, connection
        # faults and timeouts), so the claim and the dependency have to travel
        # together. An unpinned install resolved to anthropic 1.5.0, which
        # depends on httpx2 rather than httpx and is a different SDK from the
        # one the reading was taken from. Nothing else in this repository pins
        # `anthropic`; this is the only pin. Supporting 1.x needs its own
        # evidence and is not assumed from the 0.x source. The shim does not
        # rely on this pin at run time: `assert_no_provider_retries` reads the
        # effective setting back off the constructed client and refuses to run
        # if it is not zero, whatever version the operator installed.
        run: python -m pip install "anthropic==0.112.0"
      - name: A ceiling of N buys exactly N provider requests
        run: python -m unittest paper/src/test_llm_agent_budget.py
      - name: The requested model is the only policy that can answer
        run: python -m unittest paper/src/test_llm_agent_identity.py

  # --- packaged consumers: usability, not identity ----------------------------------
  # Every other packaging guard in this repository checks that the right version, commit
  # and registry are involved. None of them checks that the artifact a consumer actually
  # downloads builds, installs and runs. npm.yml already packs the tarball and installs it
  # offline; these two do the same for the crate archive and the wheel, on every pull
  # request rather than only at a tag, so a package that cannot be consumed is caught
  # before it is published rather than after.

  packaged-crate-consumer:
    name: cargo package, fresh consumer crate, run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build a throwaway crate against the packaged archives and run it
        run: python scripts/check-packaged-consumer.py

  wheel-install-import:
    name: maturin build, pip install the wheel, import
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/sharpebench-py
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the wheel
        working-directory: crates/sharpebench-py
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip maturin
          maturin build --out "$RUNNER_TEMP/dist"
          wheels=("$RUNNER_TEMP"/dist/*.whl)
          test "${#wheels[@]}" -eq 1
          test -s "${wheels[0]}"
          echo "WHEEL=${wheels[0]}" >> "$GITHUB_ENV"
      - name: Install it into a fresh venv and score one series
        # Run from outside the checkout so the import resolves to the installed wheel and
        # not to the source tree, and install only the wheel's declared dependencies: the
        # pytest job installs numpy and pytest as well, which would hide a runtime
        # dependency the wheel forgot to declare.
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          python -m venv consumer
          ./consumer/bin/pip install --quiet "$WHEEL"
          cat > smoke.py <<'PY'
          import sharpebench

          assert isinstance(sharpebench.METHODOLOGY_VERSION, str), sharpebench.METHODOLOGY_VERSION
          returns = [0.001 + 0.0001 * ((i % 5) - 2) for i in range(500)]
          verdict = sharpebench.is_my_sharpe_real(returns, n_trials=200)
          assert verdict["verdict"] in {"pass", "borderline", "fail"}, verdict
          # Two entry points into the compiled kernel must agree on the same series, so a
          # wheel that shipped a stale extension beside a current pure-Python layer fails
          # here instead of quietly returning two different numbers.
          assert verdict["sharpe"] == sharpebench.sharpe_ratio(returns), verdict
          assert verdict["n_obs"] == len(returns), verdict
          assert sharpebench.pass_k([True, True, True], mode="all")
          assert not sharpebench.pass_k([True, False, True], mode="all")
          print("imported the wheel and scored one series")
          PY
          ./consumer/bin/python smoke.py
