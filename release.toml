# SharpeBench release pipeline (cargo-release). See docs/PUBLISHING.md §5.
#
# `scripts/release.py` cuts a full release: it creates a disposable worktree from
# fetched origin/main, delegates the shared version/dependency/manifest rewrites to
# cargo-release, rebinds provenance on the clean version commit, tags that child, and
# atomically pushes the commits plus tag. Publishing itself happens in
# .github/workflows/release.yml: crates.io over OIDC, npm, PyPI, and the signed binary.
#
# Always run the green checks first — cargo-release will not:
#   cargo test --workspace && cargo clippy --workspace --all-targets && cargo deny check
#
# Then:
#   python scripts/release.py rehearse patch
#   python scripts/release.py execute patch
#
# Do not cut a release until its complete change set and release notes are on
# origin/main; the isolated driver refuses local-only notes and dirty inputs.

# Every sharpebench-* crate moves on a single version (matches `version.workspace = true`).
shared-version = true

# One release commit and one tag for the whole workspace, not one per crate.
consolidate-commits = true

# Rewrite each dependent crate's `version = "x"` requirement to the new version on
# bump. This automates the one manual gotcha (those pins are NOT workspace-inherited).
dependent-version = "upgrade"

# A single workspace tag `vX.Y.Z` — this is what release.yml builds the binary on.
tag-name = "v{{version}}"
tag-message = "SharpeBench v{{version}}"
pre-release-commit-message = "release: v{{version}}"

# cargo-release does NOT create the tag. The version bump rewrites files inside
# the provenance source scope, so a pre-commit rebind necessarily records a dirty
# generation. `scripts/release.py` rebinds after the clean version commit and tags
# that provenance-only child; v0.14.1 demonstrated why tagging the bump is wrong.
tag = false

# These crates are set to Trusted-Publishing-only on crates.io, so a token upload from
# a laptop is refused with 403 and the local machine cannot publish at all. Cutting a
# release therefore only bumps, rewrites, and commits locally; the driver's atomic
# push of the `v*` tag is what makes CI publish over OIDC (see release.yml).
publish = false
# A direct cargo-release invocation must never push a provenance-stale version
# commit. The isolated driver owns the single atomic commit+tag push.
push = false

# Guard rail: only ever release from main.
allow-branch = ["main"]

# The npm manifests are NOT workspace-inherited, so nothing used to rewrite them: the
# release job read the version out of package.json, found it already on the registry, and
# "skipped" — a green run that published nothing. That is how npm stalled at 0.0.10 while
# the crates went to 0.0.11. They are rewritten from the workspace version now, but the
# rules live in crates/sharpebench-cli/release.toml because cargo-release resolves
# `file` relative to each crate, not to the workspace root.

# The version bump rewrites files inside the provenance source scope. Rebinding
# in cargo-release's pre-commit hook cannot solve that: generation necessarily
# sees a dirty tree and records `generated_at_head_dirty: true`. It also routed
# through `bash`, mixing WSL and Windows Git paths when invoked outside Git Bash.
# `scripts/release.py` therefore owns the rebind after cargo-release has made a
# clean version commit, commits only the manifest, checks it, and tags that
# provenance-only child. There is deliberately no pre-release hook here.
