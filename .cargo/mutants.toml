# cargo-mutants configuration for the standing mutation leg in
# .github/workflows/mutation.yml (cargo-mutants 27.1.0 reads this path by
# default). The leg already narrows the run to the pull request's own diff and
# to the four pure crates, so this file only records what is never worth
# mutating and how long a mutant may run.

# Integration-test targets are never mutated by cargo-mutants, and it skips
# `#[cfg(test)]` modules and `#[test]` functions on its own. Naming the test
# directories here makes the intent visible and still holds if a crate ever
# puts helpers under `tests/` without a `#[cfg(test)]` guard.
exclude_globs = ["**/tests/**"]

# Generated code: there is none in sharpebench-core, -stats, -protocol or
# -attest. No build.rs, no include!, no bindgen or prost output. The protocol
# crate's `schema/*.json` is data that tests compare against, not Rust, so it
# is not a mutation target. Nothing to exclude on that ground; this comment
# records that the question was asked, so a future generator gets a glob here.

# Mutations no test should be able to observe. The pattern is matched against
# the mutant's name, e.g. `<impl Display for StatisticalError>::fmt`.
exclude_re = [
    # Display and Debug bodies render error and identity text. The suites
    # assert on typed error variants and on values, not on prose, so replacing
    # `fmt` with `Ok(())` changes nothing a test should pin; a missed mutant
    # here would only push tests to freeze wording.
    "<impl (std::)?(fmt::)?(Display|Debug) for ",

    # Equivalent mutants in det_math.rs (SharpeBench PR #178). Each condition
    # below is a guard whose boundary value gives the same result on either
    # branch; the reason follows each entry. Anchored by file:line:col so a
    # later edit that moves the line stops the exclusion from matching and the
    # mutant comes back as missed (fail closed) instead of hiding another one.
    # scale 313:17: k = -1022 takes the other branch, which computes y * 2^0 * 2^-1022: the same single rounding.
    '^crates/sharpebench-stats/src/det_math\.rs:313:17: replace < with <= in scale$',
    # exp_dd 328:13: at hi = 709.8, e^709.8 > f64::MAX, so the series path also returns +inf.
    '^crates/sharpebench-stats/src/det_math\.rs:328:13: replace > with >= in exp_dd$',
    # exp_dd 331:13: at hi = -746, e^-746 is below half the smallest subnormal, so the series path also returns 0.
    '^crates/sharpebench-stats/src/det_math\.rs:331:13: replace < with <= in exp_dd$',
    # exp_m1 351:30: at |x| = 2^-54 the series returns the correctly rounded e^x - 1, which is x itself.
    '^crates/sharpebench-stats/src/det_math\.rs:351:30: replace < with <= in exp_m1$',
    # exp_m1 356:10: at x = 700, e^x - 1 and e^x round to the same double, which the other path returns.
    '^crates/sharpebench-stats/src/det_math\.rs:356:10: replace > with >= in exp_m1$',
    # exp_m1 360:10: at x = -40, e^x - 1 = -1 + 4.2e-18 rounds to -1, which the series path returns.
    '^crates/sharpebench-stats/src/det_math\.rs:360:10: replace < with <= in exp_m1$',
    # ln_dd 385:11: at hi = f64::MIN_POSITIVE the 2^54 rescale is exact and e absorbs it: same m, same result.
    '^crates/sharpebench-stats/src/det_math\.rs:385:11: replace < with <= in ln_dd$',
    # ln_dd 396:63: the masked mantissa has a zero exponent field, so OR and XOR with the 1.0 exponent bits agree.
    '^crates/sharpebench-stats/src/det_math\.rs:396:63: replace \| with \^ in ln_dd$',
    # ln_dd 402:10: at m = SQRT_2 both reductions (m, e) and (m / 2, e + 1) are exact and give ln m to ~2^-100; the rounded result is the same.
    '^crates/sharpebench-stats/src/det_math\.rs:402:10: replace > with >= in ln_dd$',
    # ln_1p 457:38: at |x| = 2^-54 the series returns the correctly rounded ln(1 + x), which is x itself.
    '^crates/sharpebench-stats/src/det_math\.rs:457:38: replace < with <= in ln_1p$',
    # powf 483:23: |x| = 1 returned one line above, so ax < 1 and ax <= 1 agree here.
    '^crates/sharpebench-stats/src/det_math\.rs:483:23: replace < with <= in powf$',
    # powf 483:36: y is infinite in this branch, never 0.
    '^crates/sharpebench-stats/src/det_math\.rs:483:36: replace < with <= in powf$',
    # powf 491:34: at |y| = 2^53 the parity test (y / 2).trunc() != y / 2 already says even.
    '^crates/sharpebench-stats/src/det_math\.rs:491:34: replace < with <= in powf$',
    # powf 493:25: y = 0 returned at the top, so y < 0 and y <= 0 agree here.
    '^crates/sharpebench-stats/src/det_math\.rs:493:25: replace < with <= in powf$',
    # powf 501:30: y = 0 returned at the top.
    '^crates/sharpebench-stats/src/det_math\.rs:501:30: replace < with <= in powf$',
    # powf 502:21: x is infinite in this branch, never 0.
    '^crates/sharpebench-stats/src/det_math\.rs:502:21: replace < with <= in powf$',
    # powf 508:21: x = 0 returned above, so x > 0 and x >= 0 agree here.
    '^crates/sharpebench-stats/src/det_math\.rs:508:21: replace > with >= in powf$',
    # powf 521:10: at t = 750 the exp path overflows to the same signed infinity.
    '^crates/sharpebench-stats/src/det_math\.rs:521:10: replace > with >= in powf$',
    # powf 524:10: at t = -760 the exp path underflows to the same signed zero.
    '^crates/sharpebench-stats/src/det_math\.rs:524:10: replace < with <= in powf$',
    # powi 553:10: at n = 0 the loop leaves acc = 1, and 1 / 1 = 1.
    '^crates/sharpebench-stats/src/det_math\.rs:553:10: replace < with <= in powi$',
]

# Timeouts. The default is 1.5x the baseline test time with a 20 second floor,
# tuned for suites that finish in a second or two. The core unit suite alone
# takes several seconds and the bootstrap tests scale with the loop bounds a
# mutant may lengthen, so a slow-but-correct mutant must not be reported as a
# timeout while a hung one stays bounded. 3x the baseline with a 60 second
# floor does both. The workflow passes the same multiplier on the command line
# so the CI invocation is self-describing.
timeout_multiplier = 3.0
minimum_test_timeout = 60

# Run the suite under nextest, the runner ci.yml already uses. It stops a run
# at the first failing test, so a caught mutant costs seconds instead of the
# whole package suite. That matters because the baseline is measured with the
# machine to itself while mutants run `--jobs` at a time: each mutant run then
# gets a fraction of the cores, and a full core suite no longer fits inside a
# timeout derived from the baseline. Measured on the search-census diff, 176
# mutants in `sharpebench-core`, each test run pinned to one thread: caught
# mutants took a median of 2.5s and at most 8.5s under nextest, against a
# 91s full-suite run under `cargo test`. Nextest does not run doctests; ci.yml
# runs those separately.
test_tool = "nextest"
